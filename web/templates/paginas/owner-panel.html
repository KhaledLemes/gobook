<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/owner-panel.css">
    <script src="/js/owner-panel.js"></script>
</head>

{{ template "header.html" .}}

<body>
<main class="main-content dashboard-area">
    <div class="dashboard-header">
        <div>
            <h1 class="dashboard-title">Minhas Propriedades</h1>
            <p class="dashboard-subtitle">Gerencie seus anúncios e quartos</p>
        </div>

    <!-- Container onde o seu JS vai injetar as propriedades vindas do backend Go -->

{{ template "footer.html" . }}

</body>
</html>

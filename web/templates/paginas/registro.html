<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/css/registro.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/graduate-colorized.svg">
</head>
<body>

{{  template "header.html" . }}

<main class="main-content auth-area">
    <div class="auth-card">
        <h1 class="auth-title">Crie sua conta</h1>
        <p class="auth-subtitle">Junte-se ao GoBook para começar sua jornada.</p>

        <form class="auth-form" id="registroForm">

            <!-- ================= PÁGINA 1 ================= -->
            <div id="step1" class="form-step active">
                <div class="step-indicator">Passo 1 de 2: Acesso</div>

                <div class="input-group-auth">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="nome@email.com" required>
                </div>

                <div class="input-group-auth">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required>
                </div>
                <div id="stp1-err-cont">
                    <p id="stp1-err"></p>
                </div>
                <button type="button" class="btn btn-primary btn-auth" id="btnNext">Próximo passo</button>
            </div>

            <!-- ================= PÁGINA 2 ================= -->
            <div id="step2" class="form-step">
                <div class="step-indicator">Passo 2 de 2: Dados Pessoais</div>

                <div class="input-row">
                    <div class="input-group-auth">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Primeiro nome" required>
                    </div>
                    <div class="input-group-auth">
                        <label for="nome_meio">Nome do Meio</label>
                        <input type="text" id="nome_meio" name="nome_meio" placeholder="Opcional">
                    </div>
                </div>

                <div class="input-group-auth">
                    <label for="nome_ultimo">Último Nome</label>
                    <input type="text" id="nome_ultimo" name="nome_ultimo" placeholder="Sobrenome" required>
                </div>

                <div class="input-row">
                    <div class="input-group-auth">
                        <label for="nascimento">Nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>
                    <div class="input-group-auth">
                        <label for="tel">Telefone</label>
                        <input type="tel" id="tel" name="tel" placeholder="(11) 99999-9999" required>
                    </div>
                </div>
                <!-- Retângulo de Seleção de Role (Adicionado no final do form) -->
                <div class="role-selection">
                    <p class="role-label">Você gostaria de:</p>

                    <div class="role-options">
                        <label class="role-option">
                            <!-- value="owner" para quem vai anunciar -->
                            <input type="radio" name="tipo_conta" value="owner" required>
                            <span>Anunciar propriedades</span>
                        </label>

                        <label class="role-option">
                            <input type="radio" name="tipo_conta" value="guest">
                            <span>Alugar para viajar</span>
                        </label>
                    </div>
                </div>
                <div id="stp2-err-cont">
                    <p id="stp2-err" style="margin-top: -25px"></p>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-outline btn-auth" id="btnPrev">Voltar</button>
                    <!-- Único botão que realmente fará o submit para o Go -->
                    <button type="submit" class="btn btn-primary btn-auth" id="finish">Finalizar Cadastro</button>
                </div>

            </div>

        </form>
    </div>
</main>

{{  template "footer.html" . }}

<script src="/js/registro.js"></script>
</body>
</html>

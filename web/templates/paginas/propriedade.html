<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/propriedade.css">
    <link rel="icon" href="/img/graduate-colorized.svg">

    <script src="/js/propriedade.js"></script>

</head>
<body>

{{ template "header.html" . }}

<main class="main-content container-property">
    <!-- ================= 1. CABEÇALHO E GALERIA (Visão Geral) ================= -->
    <section class="property-header-section">
        <div class="property-top-bar">
            <div>
                <span class="property-category-tag" id="category"></span>
                <h1 class="property-title" id="title"></h1>
                <p class="property-address" id="addr"></p>
            </div>
            <div class="property-rating-box">
                <span class="rating-score" id="rating">-</span>
                <div class="rating-text">
                    <strong>Avaliação</strong>
                </div>
            </div>
        </div>

        <!-- Mosaico de Fotos -->
        <div class="property-gallery">
            <div class="gallery-main">
                <img id="main-photo" src="/img/placeholder.png" alt="Foto principal" onerror="this.src='/img/propriedades/8977d85eb56315000aad56be02a466e9.png'">
            </div>
            <!-- Você pode implementar um loop para as thumbs depois -->
            <div class="gallery-thumbs" id="gallery-thumbs">
                <!-- Thumbs injetadas via JS virão aqui -->
            </div>
        </div>

        <!-- Destaques / Comodidades -->
        <div class="property-amenities-bar" id="amenities-bar">
            <span class="amenity-item">📶 Wi-Fi gratuito</span>
            <!-- A tag Pet Friendly será injetada aqui pelo JS se for true -->
        </div>

        <!-- Descrição -->
        <div class="property-description">
            <h2 class="description-title">Sobre esta propriedade</h2>
            <p class="description-text" id="description">
                Carregando descrição da propriedade...
            </p>
        </div>
    </section>

    <!-- ================= 2. TABELA DE DISPONIBILIDADE E QUARTOS ================= -->
    <section class="availability-section" id="disponibilidade">
        <h2 class="section-title">Disponibilidade</h2>

        <form class="search-dates-bar">
            <!-- (Mantido igual, pois os inputs de pesquisa são locais do frontend) -->
            <div class="date-picker-input">
                <label>Datas da sua estadia</label>
                <input type="date" value="2026-12-01"> — <input type="date" value="2027-01-30">
            </div>
            <div class="occupancy-input">
                <label>Hóspedes</label>
                <span>2 adultos · 0 crianças</span>
            </div>
            <button type="submit" class="btn btn-primary">Alterar pesquisa</button>
        </form>

        <div class="rooms-table-wrapper">
            <table class="rooms-table">
                <thead>
                <tr>
                    <th style="width: 30%;">Categoria do quarto</th>
                    <th style="width: 10%;">Hóspedes</th>
                    <th style="width: 20%;">Preço</th>
                    <th style="width: 25%;">Suas escolhas</th>
                    <th style="width: 15%;">Selecionar nº de quartos</th>
                </tr>
                </thead>
                <!-- O tbody está vazio! O JS vai criar as linhas dos quartos aqui -->
                <tbody id="rooms-tbody">
                </tbody>
            </table>
        </div>
    </section>
</main>

{{ template "footer.html" . }}

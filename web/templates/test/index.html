<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBook - Reservas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a class="logo" href="/">GoBook</a>
        <div class="header-actions">
            <a href="#" class="contact-icon" title="Atendimento">
                <!-- Ícone SVG de Contato -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </a>
            <button class="btn btn-outline">Anunciar propriedade</button>
            <button class="btn btn-light">Cadastre-se</button>
            <button class="btn btn-light">Login</button>
        </div>
    </div>
</header>

<main class="container">
    <section class="hero">
        <h1>Encontre seu próximo destino</h1>
        <p>Planeje a viagem dos seus sonhos</p>
    </section>

    <section class="search-section">
        <form class="search-form" id="searchForm">
            <!-- Campo 1: Destino -->
            <div class="input-group">
                <label class="sr-only">Destino planejado</label>
                <input type="text" placeholder="Para onde você vai?" required>
            </div>

            <!-- Campo 2: Datas -->
            <div class="input-group dates-group">
                <label class="sr-only">Selecionar datas</label>
                <div class="date-inputs">
                    <input type="date" id="checkin" required title="Data de Check-in">
                    <span> — </span>
                    <input type="date" id="checkout" required title="Data de Check-out">
                </div>
            </div>

            <!-- Campo 3: Hóspedes (Interativo) -->
            <div class="input-group guests-group" id="guestsContainer">
                <label class="sr-only">Selecionar hóspedes</label>
                <div class="guests-display" id="guestsToggle">
                    <span id="adultCountDisplay">2</span> adultos · <span id="childCountDisplay">0</span> crianças
                </div>

                <!-- Dropdown de Hóspedes -->
                <div class="guests-popup" id="guestsPopup">
                    <div class="guest-row">
                        <span>Adultos</span>
                        <div class="counter">
                            <button type="button" class="btn-counter" onclick="updateGuest('adult', -1)">−</button>
                            <span id="adultVal">2</span>
                            <button type="button" class="btn-counter" onclick="updateGuest('adult', 1)">+</button>
                        </div>
                    </div>
                    <div class="guest-row">
                        <span>Crianças</span>
                        <div class="counter">
                            <button type="button" class="btn-counter" onclick="updateGuest('child', -1)">−</button>
                            <span id="childVal">0</span>
                            <button type="button" class="btn-counter" onclick="updateGuest('child', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-search">Pesquisar</button>
        </form>

        <div class="extras">
            <label class="checkbox-label">
                <input type="checkbox" id="pets">
                Vou levar pets
            </label>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
